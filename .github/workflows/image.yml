# Builds the image natively for amd64 and arm64 (Raspberry Pi etc.)
# and publishes it to GitHub Container Registry as ghcr.io/<owner>/<repo>.
# Pull requests only build. A first push creates a *private* package; make it
# public once under the package's settings on GitHub.
#
# Tags: each night `main` is published as `nightly`, skipped when `nightly`
# was already built from the same commit (running the workflow by hand on
# `main` always publishes). A `vX.Y.Z` tag publishes `X.Y.Z`, `X.Y`, `X`
# (from 1.0) and `latest`, and creates the GitHub release from that version's
# section in CHANGELOG.md, with the binaries and Debian packages for amd64 and
# arm64 attached (`packages`; pull requests build them as a check). A release
# without a `-` in its tag then asks gbs-anywhere-pi to build a Raspberry Pi
# image from its arm64 Debian package.
name: image

on:
  push:
    tags: ["v*"]
  pull_request:
  schedule:
    # 02:23 UTC; off the hour, when GitHub delays scheduled runs the most.
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time per ref, so a manual run and the nightly don't race.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: docker/login-action@v4
        if: github.event_name == 'schedule'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The merge job writes the commit into the index's annotations; a
      # missing or unreadable `nightly` means build.
      - name: Skip the nightly when main has not changed
        id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
            && [ "$GITHUB_REF" != refs/heads/main ] \
            && [[ $GITHUB_REF != refs/tags/v* ]]; then
            echo "::error::run this on main (nightly) or on a vX.Y.Z tag (release)"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            built=$(docker buildx imagetools inspect --raw "ghcr.io/${GITHUB_REPOSITORY,,}:nightly" \
              | jq -r '.annotations["org.opencontainers.image.revision"] // empty') || true
            if [ "$built" = "$GITHUB_SHA" ]; then
              echo "::notice::nightly is already $GITHUB_SHA; nothing to build"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against Cargo.toml and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Image name (lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # GitHub reports plain AGPL-3.0; give the exact SPDX id.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GBS_COMMIT=${{ !startsWith(github.ref, 'refs/tags/') && github.sha || '' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=${{ env.ARCH }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        if: env.PUSH == 'true'
        with:
          name: digest-${{ env.ARCH }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # `latest` comes from the semver tags (flavor latest=auto), so it
          # only moves on a release; pre-releases get their exact tag only.
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # The binary as a tarball and the Debian package, for people who run
  # gbs-anywhere without Docker (a Raspberry Pi, say). Built in Debian 12 so
  # they work with its glibc and newer (see packaging/build-release.sh).
  packages:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build the tarball and the Debian package
        env:
          GBS_COMMIT: ${{ !startsWith(github.ref, 'refs/tags/') && github.sha || '' }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GBS_COMMIT \
            rust:1-bookworm sh packaging/build-release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [merge, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/dist
          pattern: packages-*
          merge-multiple: true

      - name: Checksums
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on = 1; next} /^## / {on = 0} on' \
            CHANGELOG.md > "$notes"
          flags=()
          if [[ $TAG == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes" "${flags[@]}" \
            "$RUNNER_TEMP"/dist/*

      # The image build downloads the .deb and SHA256SUMS from the release
      # above, so this comes after it. The token comes from a GitHub App
      # installed only on gbs-anywhere-pi, with Contents: write and nothing
      # else. If this fails, the release is already out: start the image by
      # hand from gbs-anywhere-pi's Actions → Image → Run workflow.
      - uses: actions/create-github-app-token@v3
        id: pi-token
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          client-id: ${{ vars.PI_IMAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PI_IMAGE_APP_KEY }}
          owner: Skamba
          repositories: gbs-anywhere-pi
          permission-contents: write

      - name: Ask gbs-anywhere-pi to build an image
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ steps.pi-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh api repos/Skamba/gbs-anywhere-pi/dispatches
          -f event_type=gbs-anywhere-release
          -f "client_payload[version]=${TAG#v}"
