# Formatting, lints and tests on every push and pull request. The image
# workflow only builds the release binary; this is what checks the code.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The `main` ruleset requires this job by name; rename both together.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain and components from rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
