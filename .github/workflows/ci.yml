# Formatting, lints, docs and tests on every push and pull request, and a
# build with the oldest Rust Cargo.toml allows. The image workflow only
# builds the release binary; this is what checks the code. Actions are
# pinned to a commit, as in image.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The `main` ruleset requires this job by name; rename both together.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain and components from rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked

  # The oldest Rust that `rust-version` in Cargo.toml promises; next to
  # `test` so that it doesn't make the other checks wait.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # RUSTUP_TOOLCHAIN takes the place of rust-toolchain.toml for the
      # steps below, rust-cache included.
      - name: Install the Rust version from Cargo.toml
        run: |
          msrv=$(grep -m 1 '^rust-version = ' Cargo.toml | cut -d '"' -f 2)
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo check --all-targets --locked
