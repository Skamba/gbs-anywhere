[package]
name = "gbs-anywhere"
description = "Grind-by-Sync for Mahlkönig E64 WS and E65/E80 GbS with any espresso machine"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
p256 = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
# Only to pick the TLS crypto provider for reqwest (ring needs no cmake).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tokio = { version = "1.53.1", features = ["full"] }
# WebSocket client for the Half Decent Scale (plain ws:// on the home
# network, so no TLS features).
tokio-tungstenite = "0.30"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true

# The Debian package attached to each release, made by cargo-deb in image.yml
# after `cargo build --release` and `cargo about generate` (see there).
[package.metadata.deb]
maintainer = "gbs-anywhere <https://github.com/Skamba/gbs-anywhere/issues>"
copyright = "2026 Skamba and the gbs-anywhere contributors"
license-file = ["LICENSE", "0"]
section = "net"
extended-description = """\
Stands in for the espresso machine a Mahlkönig grinder syncs with \
(Grind-by-Sync): the E64 WS polls it, an E65/E80 GbS is polled by it. Each \
shot's time and weight, typed on a phone or reported by an integration, \
let the grinder adjust its grind setting. Runs as the gbs-anywhere service \
on port 80. Not affiliated with Mahlkönig or Hemro."""
assets = [
    ["target/release/gbs-anywhere", "usr/bin/", "755"],
    ["packaging/deb/default", "etc/default/gbs-anywhere", "600"],
    ["README.md", "usr/share/doc/gbs-anywhere/", "644"],
    ["target/THIRD-PARTY-NOTICES", "usr/share/doc/gbs-anywhere/", "644"],
]
maintainer-scripts = "packaging/deb/"
systemd-units = { enable = true, start = true }
